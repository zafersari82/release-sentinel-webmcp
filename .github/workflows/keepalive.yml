name: keepalive

# Free hosting tiers spin a service down when idle, and the next visitor pays the
# cold start. During judging that visitor is a judge. This pings the deployment so
# the container stays warm.
#
# Setup: add a repository variable named LIVE_URL (Settings → Secrets and variables
# → Actions → Variables) set to the deployed base URL, e.g. https://your-app.onrender.com
#
# Remove or disable this workflow after judging closes.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the WebMCP tool catalog
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "LIVE_URL repository variable is not set; nothing to ping."
            exit 0
          fi

          code=$(curl -s -o /tmp/tools.json -w '%{http_code}' --max-time 90 \
            "${LIVE_URL%/}/v1/webmcp/tools")

          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Deployment did not return 200."
            exit 1
          fi

          python3 -c "
          import json
          tools = json.load(open('/tmp/tools.json'))['tools']
          print(f'{len(tools)} tools registered')
          assert len(tools) == 12, f'expected 12 tools, got {len(tools)}'
          "
