[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-sentinel"
dynamic = ["version"]
description = "Evidence-first autonomous release and clean-rebuild governance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[a2a]==2.6.0",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "opentelemetry-api>=1.42,<2",
  "opentelemetry-sdk>=1.42,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
]

[project.optional-dependencies]
cloud = [
  "google-auth>=2.40,<3",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3.0,<4",
  "google-cloud-kms>=3.0,<4",
  "PyYAML>=6,<7",
]
dev = [
  # AgentSeal is repo-local; install packages/agentseal explicitly. Do not resolve the unrelated PyPI package.
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]
browser = [
  "playwright>=1.55,<2",
]

[project.scripts]
release-sentinel = "release_sentinel.interfaces.cli:main"

[tool.setuptools.dynamic]
version = {attr = "release_sentinel.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"release_sentinel.interfaces" = ["static/*"]
"release_sentinel.demo_fixture" = [
  "*.json",
  "*.sha256",
  "repository_vulnerable/*.py",
  "repository_vulnerable/*.md",
  "repository_vulnerable/*.json",
  "repository_fixed/*.py",
  "repository_path_traversal_vulnerable/*.py",
  "repository_path_traversal_fixed/*.py",
  "repository_evidence_tamper_vulnerable/*.py",
  "repository_evidence_tamper_fixed/*.py",
]
"release_sentinel.coverage" = ["*.json"]
"release_sentinel.coverage.challenges" = ["*.json"]
